# Netlify configuration.
# The serverless function lives in /api/inquiry.js for Vercel. On Netlify,
# create netlify/functions/inquiry.js with the wrapper shown in SETUP.md and
# the redirect below points /api/inquiry at it.

[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/inquiry"
  to = "/.netlify/functions/inquiry"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
